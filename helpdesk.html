const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resetState(){tickets=initialTickets.map(t=>({...t}));groups=[];intakeIndex=0;filter='Alle';}
function toast(message,type='ok'){const el=document.createElement('div');el.className='toast'+(type==='error'?' toast-error':'');el.innerHTML='<span class="toast-mark" aria-hidden="true">'+(type==='error'?'!':'✓')+'</span><span>'+esc(message)+'</span>';$('#toast-region').append(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(5px)';setTimeout(()=>el.remove(),220)},3600)}
function relatedTickets(){return tickets.filter(t=>t.department==='Vertrieb'&&t.system==='CRM'&&t.id!=='HD-2407')}
function getGroup(id){return groups.find(g=>g.id===id)}
function groupForTicket(t){return groups.find(g=>g.ticketIds.includes(t.id))}
function statusClass(s){return s==='Offen'?'status-open':s==='In Bearbeitung'?'status-progress':'status-resolved'}
function setView(view){currentView=view;document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const labels={dashboard:'Dashboard',tickets:'Ticketliste',groups:'Sammeltickets',help:'Hilfe'};$('#crumb-current').textContent=labels[view];render();window.scrollTo({top:0,behavior:'smooth'})}
function header(title,sub,kicker){return `<div class="page-head"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p class="page-sub">${sub}</p></div><div class="page-kicker">Stand: heute, 09:18</div></div>`}
function renderDashboard(){let related=relatedTickets();let active=related.length;return `${header('Guten Morgen, Helpdesk','Ein kompakter Überblick über Meldungen und mögliche gemeinsame Ursachen.','Lagebild · Support')}
<div class="stats"><article class="stat" style="--tint:#e7f1fa;--mark:#437aa2"><div class="stat-top"><span class="stat-mark"></span>Offene Tickets</div><div class="stat-num">${tickets.filter(t=>t.status!=='Gelöst').length}</div><div class="stat-note">Über alle Abteilungen</div></article><article class="stat" style="--tint:#e3f4f1"><div class="stat-top"><span class="stat-mark"></span>Gebündelte Meldungen</div><div class="stat-num">${groups.reduce((n,g)=>n+g.ticketIds.length,0)}</div><div class="stat-note">In gemeinsamen Vorgängen</div></article><article class="stat" style="--tint:#fff0da;--mark:#c2832b"><div class="stat-top"><span class="stat-mark"></span>Sammeltickets</div><div class="stat-num">${groups.length}</div><div class="stat-note">Abteilungsübergreifende Sicht</div></article><article class="stat" style="--tint:#f8eae7;--mark:#b96256"><div class="stat-top"><span class="stat-mark"></span>Aktuelle Probleme</div><div class="stat-num">${active?1:0}</div><div class="stat-note">Erkannte Häufungen</div></article></div>
<div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Aktuelle Probleme</h2><p>Häufungen, die Aufmerksamkeit verdienen</p></div><span class="match-chip">${active} Meldungen · CRM</span></div><div class="problem-list">${active?`<div class="problem"><span class="problem-pin"></span><div><div class="problem-title">Zugriff auf CRM-System in Vertrieb gestört</div><div class="problem-meta">Vertrieb · CRM · erste Meldung heute um 09:02</div></div><span class="problem-count">${active} Tickets</span></div>`:'<div class="empty">Zurzeit keine Häufungen erkannt.</div>'}<div class="problem"><span class="problem-pin" style="background:#8ba1ad;box-shadow:0 0 0 4px #eef2f4"></span><div><div class="problem-title">Druckerproblem im Versand</div><div class="problem-meta">Einzelmeldung · Logistik</div></div><span class="problem-count">1 Ticket</span></div></div></section>
<aside class="suggestion"><div class="suggestion-kicker">Erkannte Ähnlichkeit · ${active?Math.min(98,88+Math.max(0,active-3)*2):'—'}%</div><h2>${active?'Mehrere CRM-Meldungen könnten zusammengehören':'Keine offenen Gruppierungsvorschläge'}</h2><p>${active?`${active} Meldungen aus Vertrieb beschreiben innerhalb weniger Minuten Zugriffsprobleme am selben System. Prüfen und bei Bedarf gemeinsam bearbeiten.`:'Neue passende Meldungen erscheinen hier als Vorschlag und können bei Bedarf gemeinsam bearbeitet werden.'}</p><button class="btn btn-primary btn-small" data-action="review-similar">${active?'Ähnliche Tickets prüfen':'Ticketliste öffnen'} <span aria-hidden="true">→</span></button></aside></div>
<section class="panel activity"><div class="panel-head"><div><h2>Letzte Meldungen</h2><p>Aktuelle Eingänge aus dem Helpdesk</p></div><button class="text-button" data-view="tickets">Zur Ticketliste →</button></div><div class="activity-body">${tickets.slice().reverse().slice(0,3).map(t=>`<div class="activity-row"><span><b>${esc(t.subject)}</b> · ${esc(t.department)}</span><time>${esc(t.time)}</time></div>`).join('')}</div></section>`}
function renderTickets(){let rel=new Set(relatedTickets().map(t=>t.id));let filtered=filter==='Alle'?tickets:filter==='Ähnlich'?tickets.filter(t=>rel.has(t.id)):filter==='Gebündelt'?tickets.filter(t=>groupForTicket(t)):tickets.filter(t=>!groupForTicket(t));let canBundle=relatedTickets().length>=2&&!groups.length;return `${header('Ticketliste','Einzelmeldungen bleiben nachvollziehbar – auch wenn sie gemeinsam bearbeitet werden.','Eingang · Alle Abteilungen')}
<div class="ticket-toolbar"><div class="filter-group" aria-label="Ticketfilter">${['Alle','Ähnlich','Gebündelt','Nicht gebündelt'].map(x=>`<button class="filter-pill ${filter===x?'active':''}" data-filter="${x}" aria-pressed="${filter===x}">${x}</button>`).join('')}</div><button class="btn btn-primary btn-small" data-action="bundle" ${canBundle?'':'disabled'}><span class="btn-icon" aria-hidden="true">◎</span>${groups.length?'Sammelticket erstellt':'Ähnliche Tickets bündeln'}</button></div>
<div class="table-shell"><table class="ticket-table"><thead><tr><th>Ticket</th><th>Abteilung</th><th>Status</th><th>Melder</th><th>Zeit</th><th>Hinweis</th></tr></thead><tbody>${filtered.map(t=>{let g=groupForTicket(t),isRel=rel.has(t.id);return `<tr class="ticket-row" data-ticket="${esc(t.id)}" tabindex="0" aria-label="Ticket ${esc(t.id)}: ${esc(t.subject)} öffnen"><td><div class="ticket-subject">${esc(t.subject)}</div><div class="ticket-id">${esc(t.id)}</div></td><td>${esc(t.department)}</td><td><span class="status ${statusClass(t.status)}">${esc(t.status)}</span></td><td class="reporter">${esc(t.reporter)}</td><td class="time-cell">${esc(t.time)}</td><td>${g?`<span class="badge badge-group">Gebündelt in ${esc(g.id)}</span>`:isRel?`<span class="badge badge-related">Wahrscheinlich zusammenhängend</span>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Keine Tickets in diesem Filter.</td></tr>'}</tbody></table></div><div class="table-note">Ähnlichkeit ist ein unverbindlicher Hinweis und kein automatischer Befund. Die CRM-Meldungen passen nach Abteilung, Formulierung, Zeitraum und System zusammen.</div>`}
function renderGroupDetail(g){return `<section class="panel detail-panel"><div class="detail-intro"><div class="collection-top"><span class="collection-code">${esc(g.id)} · SAMMELTICKET</span><span class="status status-progress">${esc(g.status)}</span></div><h2>${esc(g.title)}</h2><p>${esc(g.summary)}</p></div><div class="detail-facts"><span class="fact">Abteilung: Vertrieb</span><span class="fact">System: CRM</span><span class="fact">${g.ticketIds.length} verknüpfte Originaltickets</span><span class="fact">Zuletzt aktualisiert: ${esc(g.updated)}</span></div><div class="linked-title">Zugeordnete Originaltickets <span>${g.ticketIds.length}</span></div><div class="linked-list">${g.ticketIds.map(id=>{let t=tickets.find(x=>x.id===id);return t?`<div class="linked-item"><div style="flex:1"><button class="ticket-link" data-ticket="${esc(t.id)}">${esc(t.subject)}</button><small>${esc(t.id)} · ${esc(t.reporter)} · ${esc(t.time)}</small></div><span class="status ${statusClass(t.status)}">${esc(t.status)}</span></div>`:''}).join('')}</div></section>`}
function renderGroups(){return `${header('Sammeltickets','Gemeinsame Bearbeitung – mit direktem Rückweg zu jeder Originalmeldung.','Vorgänge · Bündelung')}${groups.length?`<div class="collections-grid">${groups.map(g=>`<article class="panel collection-card"><div class="collection-top"><span class="collection-code">${esc(g.id)}</span><span class="status status-progress">${esc(g.status)}</span></div><h2>${esc(g.title)}</h2><p>${esc(g.summary)}</p><div class="collection-foot"><span>${g.ticketIds.length} Originaltickets · ${esc(g.updated)}</span><button class="text-button" data-action="group-detail" data-group="${esc(g.id)}">Details ansehen →</button></div></article>`).join('')}</div>${groups.map(g=>renderGroupDetail(g)).join('')}`:'<section class="panel"><div class="empty"><div style="font:500 24px var(--serif);color:var(--ink);margin-bottom:7px">Noch keine Sammeltickets</div><p>Wenn ähnliche Meldungen zusammenpassen, kannst du sie in der Ticketliste zu einem gemeinsamen Vorgang bündeln.</p><button class="btn btn-primary" data-view="tickets">Zur Ticketliste</button></div></section>'}`}
function renderHelp(){return `${header('Hilfe','Ähnliche Meldungen lassen sich zu einem gemeinsamen Vorgang bündeln.','Arbeitsweise · Tickets')}
<div class="help-grid"><article class="panel help-card"><h2>Ähnliche Meldungen erkennen</h2><p>Für einen Gruppierungsvorschlag werden Abteilung, Formulierungen, zeitlicher Abstand und das betroffene System gemeinsam betrachtet. Der Hinweis unterstützt die Einordnung; die Entscheidung zum Bündeln bleibt beim Helpdesk.</p></article><article class="panel help-card"><h2>Gemeinsam bearbeiten</h2><p>Beim Bündeln entsteht ein Sammelticket mit den zugeordneten Originalmeldungen. So lassen sich zusammenhängende Störungen gemeinsam verfolgen.</p></article><article class="panel help-card"><h2>Originale bleiben erhalten</h2><p>Jedes Ticket bleibt in der Ticketliste sichtbar und kann weiterhin einzeln geöffnet werden. Im Sammelticket sind alle zugeordneten Meldungen direkt erreichbar.</p></article><article class="panel help-card"><h2>Ansicht zurücksetzen</h2><p>Mit dieser Funktion kehren Ticketliste und Sammeltickets zum Ausgangszustand dieser Ansicht zurück.</p><button class="btn btn-small" data-action="reset">Ansicht zurücksetzen</button></article></div>`}
function render(){const main=$('#main-content');main.innerHTML=currentView==='dashboard'?renderDashboard():currentView==='tickets'?renderTickets():currentView==='groups'?renderGroups():renderHelp();$('#nav-ticket-count').textContent=tickets.length;$('#nav-group-count').textContent=groups.length;}
function openTicket(id){const t=tickets.find(x=>x.id===id);if(!t)return;const g=groupForTicket(t);const modal=$('#modal-root');modal.innerHTML=`<div class="modal-backdrop" data-close-overlay><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><p class="eyebrow">Originalmeldung · ${esc(t.id)}</p><h2 id="modal-title">${esc(t.subject)}</h2></div><button class="close-button" data-close aria-label="Dialog schließen">×</button></header><div class="modal-body"><div class="modal-badges"><span class="status ${statusClass(t.status)}">${esc(t.status)}</span><span class="badge badge-neutral">${esc(t.department)}</span>${g?`<span class="badge badge-group">Gebündelt in ${esc(g.id)}</span>`:relatedTickets().some(x=>x.id===t.id)?'<span class="badge badge-related">Wahrscheinlich zusammenhängend</span>':''}</div><div class="field-grid"><div class="field"><span>Melder/in</span><strong>${esc(t.reporter)}</strong></div><div class="field"><span>Zeitpunkt</span><strong>${esc(t.time)} · heute</strong></div><div class="field"><span>Abteilung</span><strong>${esc(t.department)}</strong></div><div class="field"><span>Betroffenes System</span><strong>${esc(t.system)}</strong></div></div><div class="eyebrow">Meldungstext</div><div class="modal-copy">${esc(t.text)}</div>${g?`<div class="modal-rel"><h3>Zugehöriger Sammelvorgang</h3><div class="linked-item"><div style="flex:1"><b>${esc(g.title)}</b><small>${esc(g.id)} · ${g.ticketIds.length} Originaltickets</small></div><button class="text-button" data-open-group="${esc(g.id)}">Ansehen →</button></div></div>`:''}</div><footer class="modal-footer"><button class="btn" data-close>Schließen</button></footer></section></div>`;modal.querySelector('[data-close]').focus()}
function openGroupFirst(id){closeModal();setView('groups');const card=document.querySelector(`[data-group="${id}"]`);if(card)card.focus()}
function closeModal(){const m=$('#modal-root');m.innerHTML='';}
function bundle(){if(groups.length){toast('Die passenden Meldungen sind bereits in SAM-001 gebündelt.');return}const ids=relatedTickets().map(t=>t.id);if(ids.length<2){toast('Es gibt noch nicht genügend ähnliche Meldungen zum Bündeln.','error');return}const g={id:'SAM-001',title:'CRM-Zugriff gestört – Vertrieb',summary:'Mehrere Mitarbeitende im Vertrieb melden, dass das CRM nach der Anmeldung nicht erreichbar ist. Die Meldungen liegen zeitlich eng beieinander und beziehen sich auf dasselbe System.',ticketIds:ids,status:'In Bearbeitung',updated:'09:18'};groups.push(g);render();toast(`${ids.length} ähnliche Tickets wurden einem gemeinsamen Vorgang zugeordnet.`)}
function addIncomingTicket(){if(intakeIndex>=incomingTickets.length){toast('Es liegen keine weiteren neuen Tickets vor.');return}let t={...incomingTickets[intakeIndex++]};let g=groups.find(x=>t.department==='Vertrieb'&&t.system==='CRM'&&x.title.includes('CRM'));tickets.push(t);if(g){g.ticketIds.push(t.id);g.updated=t.time;toast(`${t.id}: Ähnlichkeit erkannt und automatisch ${g.id} zugeordnet.`)}else if(t.department==='Vertrieb'&&t.system==='CRM'){toast(`${t.id}: Ähnliche CRM-Meldungen erkannt. Vorschlag zum Bündeln – noch kein Sammelticket vorhanden.`)}else{toast(`${t.id}: Passt zu keinem bestehenden Sammelticket.`)}render()}
function onAction(action,el){if(action==='bundle')bundle();if(action==='review-similar'){setView('tickets');toast('Drei CRM-Meldungen als zusammenhängend erkannt. Prüfe sie vor dem Bündeln.')}if(action==='group-detail'){const g=getGroup(el.dataset.group);if(g){document.getElementById('group-detail-'+g.id)?.scrollIntoView({behavior:'smooth'});const detail=document.querySelector('.detail-panel');if(detail){detail.setAttribute('tabindex','-1');detail.focus()}}}if(action==='reset'){resetState();render();closeModal();toast('Ansicht auf den Ausgangszustand zurückgesetzt.')} }
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}const filterBtn=e.target.closest('[data-filter]');if(filterBtn){filter=filterBtn.dataset.filter;render();return}const ticket=e.target.closest('[data-ticket]');if(ticket){openTicket(ticket.dataset.ticket);return}const action=e.target.closest('[data-action]');if(action){onAction(action.dataset.action,action);return}const close=e.target.closest('[data-close]');if(close){closeModal();return}const group=e.target.closest('[data-open-group]');if(group){openGroupFirst(group.dataset.openGroup);return}if(e.target.matches('[data-close-overlay]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ticket-row')){e.preventDefault();openTicket(e.target.dataset.ticket)}});
$('#new-ticket-btn').addEventListener('click',addIncomingTicket);$('#reset-btn').addEventListener('click',()=>{resetState();render();toast('Ansicht auf den Ausgangszustand zurückgesetzt.')});resetState();render();
})();
</script>
